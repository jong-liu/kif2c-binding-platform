name: predict

# 當 jobs/ 有新 job spec 被推上來時觸發；運算派到本機 self-hosted GPU runner。
on:
  push:
    branches: [main]      # 僅 main 分支；避免推 tag 時誤觸發重跑整批
    paths:
      - "jobs/**.json"
  workflow_dispatch: {}   # 也可手動觸發

permissions:
  contents: write          # 讓 runner 能把 results/ 推回 repo

jobs:
  predict:
    # 這些標籤要對應你在本機註冊 runner 時設定的標籤
    runs-on: [self-hosted, gpu]
    concurrency:
      group: gpu-rtx3060     # 單 GPU：同時只跑一個，其餘排隊
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Chai-1 env (uv, 持久 venv)
        env:
          KIF2C_VENV: /home/jong/.local/share/kif2c-venv
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # venv 不在則用 uv 建 Python 3.12（系統 python 為 3.14，chai/torch 無 wheel）
          if [ ! -x "$KIF2C_VENV/bin/python" ]; then
            uv venv --python 3.12 "$KIF2C_VENV"
          fi
          # 只在缺 chai_lab 時安裝（首次較久；之後秒過）
          if ! "$KIF2C_VENV/bin/python" -c "import chai_lab" 2>/dev/null; then
            uv pip install --python "$KIF2C_VENV/bin/python" -r runner/requirements.txt
          fi
          "$KIF2C_VENV/bin/python" -c "import torch; print('cuda:', torch.cuda.is_available())"

      - name: Run pending predictions
        env:
          KIF2C_VENV: /home/jong/.local/share/kif2c-venv
          PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
          KIF2C_COMMIT_EACH: "1"     # 每跑完一條就 commit+push（前端即時可見、不會被重 checkout 清掉）
        run: |
          git config user.name  "kif2c-runner[bot]"
          git config user.email "runner@users.noreply.github.com"
          bash runner/run_pending.sh

      - name: Commit results (safety net)
        # 收尾安全網：逐條推送若有漏網（push 全失敗），這裡補推一次
        run: |
          git config user.name  "kif2c-runner[bot]"
          git config user.email "runner@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "無漏網結果，略過"
          else
            git commit -m "results: $(date -u +%Y-%m-%dT%H:%M:%SZ) (safety net)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              echo "回推衝突，重試 $i"; sleep 3
            done
          fi
